# Home Credit Default Risk — reference multi-table config.
#
# 2018 Kaggle competition: predict loan default from a main application table
# plus 6 auxiliary tables in a hierarchy. Each customer (SK_ID_CURR) has many
# bureau records, many previous applications, etc. — pre-joining would explode
# rows. So we use multi_table mode and let the agent invent aggregations.
#
# Reference targets (private LB):
#   - Naive xgboost on application_train.csv only: ~0.74-0.76
#   - Kaggle median submission:                     ~0.78
#   - Kaggle silver tier (top ~5%):                 ~0.795
#   - Kaggle gold tier (top ~2%):                   ~0.80
#   - Kaggle 1st place:                              0.805
#
# To run:
#   1. Download from https://www.kaggle.com/competitions/home-credit-default-risk/data
#   2. Place CSVs in ./data/home-credit/
#   3. python -m helpers.autoresearch.harness_factory \
#        helpers/autoresearch/configs/home_credit.yaml --dry-run
#   4. python -m helpers.autoresearch.runner ... --max-cost 250 --max-hours 6

name: "Home Credit Default Risk"
data_dir: ./data/home-credit/

main_table:
  path: application_train.csv
  format: csv

target_column: TARGET
id_column: SK_ID_CURR

# Auxiliary tables — the agent receives these as raw DataFrames and decides
# which aggregations to compute. SK_ID_BUREAU and SK_ID_PREV link the nested
# tables (bureau_balance under bureau, POS_CASH_balance / installments /
# credit_card_balance under previous_application).
auxiliary_tables:
  - name: bureau
    path: bureau.csv
    format: csv
    join_key: SK_ID_CURR

  - name: bureau_balance
    path: bureau_balance.csv
    format: csv
    join_key: SK_ID_BUREAU   # joins to bureau, not main

  - name: previous_application
    path: previous_application.csv
    format: csv
    join_key: SK_ID_CURR

  - name: POS_CASH_balance
    path: POS_CASH_balance.csv
    format: csv
    join_key: SK_ID_PREV   # joins to previous_application

  - name: installments_payments
    path: installments_payments.csv
    format: csv
    join_key: SK_ID_PREV

  - name: credit_card_balance
    path: credit_card_balance.csv
    format: csv
    join_key: SK_ID_PREV

multi_table: true   # agent's pipeline receives dict of raw tables, must aggregate itself

split:
  strategy: stratified   # IID problem; stratify on TARGET to keep class balance
  holdout_frac: 0.20
  random_seed: 42

scorer: roc_auc
timeout_seconds: 1800   # multi-table FE + ensemble fit on 300K rows is slow; 30 min cap per experiment

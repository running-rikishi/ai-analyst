# IEEE-CIS Fraud Detection — reference single-table config.
#
# This is the dataset the framework was originally battle-tested on.
# Two CSV files (transactions + identity) joined 1:1 on TransactionID,
# time-ordered 80/20 holdout split via TransactionDT, ROC-AUC scoring.
#
# Use this as a starting template for any binary-classification problem
# with a time-ordered split and one or two 1:1-joined auxiliary tables.
#
# Smoke-test:
#   python -m helpers.autoresearch.harness_factory \
#     helpers/autoresearch/configs/ieee_cis_fraud.yaml --dry-run

name: "IEEE-CIS Fraud Detection"
data_dir: ./data/ieee-fraud-detection/

main_table:
  path: train_transaction.csv
  format: csv

target_column: isFraud
id_column: TransactionID

# Auxiliary tables joined 1:1 onto main. For 1:N relationships, use
# multi_table mode instead (see home_credit.yaml).
auxiliary_tables:
  - name: identity
    path: train_identity.csv
    format: csv
    join_key: TransactionID
    join_strategy: left   # left join preserves all transactions even if no identity record

multi_table: false   # pre-join into a single X_train; agent's pipeline gets (X_train, y_train)

split:
  strategy: time_ordered
  holdout_frac: 0.20
  time_column: TransactionDT   # relative seconds; last 20% by time = holdout
  random_seed: 42

scorer: roc_auc
timeout_seconds: 600   # per-experiment fit+predict timeout
